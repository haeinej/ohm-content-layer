# cortex hooks for Codex. The cortex folder is CORTEX_DIR, or ~/cortex.
# Name the MCP server's agent the same way (CORTEX_AGENT = "codex"), so a distill counts.

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "cortex hook session-start --agent codex"
timeout = 5

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "cortex hook prompt --agent codex"
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "cortex hook stop --agent codex"
timeout = 5

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "cortex hook session-end --agent codex"
timeout = 3
