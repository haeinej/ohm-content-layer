name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix app
      - run: npm --prefix app test
      - run: npm ci --prefix vault
      - run: npm ci --prefix vault/service
      - run: npm test
